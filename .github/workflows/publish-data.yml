name: Publish STATOR49 data

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - current_data.py
      - publish_feed.py
      - test_current_data.py
      - build_data.py
      - validate_release.py
      - test_build_data.py
      - .github/workflows/publish-data.yml
  schedule:
    - cron: '17 7,18,20,21,22,23 * * *'
      timezone: Europe/Paris

permissions:
  contents: write

concurrency:
  group: stator49-data-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test publication safeguards
        run: python3 -m unittest -v

      - name: Build archive from FDJ
        run: python3 current_data.py

      - name: Validate against the published archive
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 validate_release.py

      - name: Publish a complete immutable release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST_DRAW="$(python3 -c "import json; print(json.load(open('dist/manifest.json'))['lastDraw'])")"
          VERSION="$(python3 -c "import json; print(json.load(open('dist/manifest.json'))['archiveVersion'])")"
          TAG="data-${VERSION#stator49-fdj-}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$TAG" dist/manifest.json dist/loto_draws.json --clobber
          else
            gh release create "$TAG" dist/manifest.json dist/loto_draws.json --draft \
              --title "STATOR49 data — $LAST_DRAW" \
              --notes "Archive publique Loto + Super Loto reconstruite depuis les historiques FDJ."
          fi
          gh release edit "$TAG" --draft=false --latest

      - name: Publish the lightweight feed after checking the immutable release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 publish_feed.py
