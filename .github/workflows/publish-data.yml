name: Publish STATOR49 data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_data.py
      - validate_release.py
      - test_build_data.py
      - .github/workflows/publish-data.yml
  schedule:
    - cron: '0 18,20 * * *'
      timezone: Europe/Paris

permissions:
  contents: write

concurrency:
  group: stator49-data-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test publication safeguards
        run: python3 -m unittest -v test_build_data.py

      - name: Build archive from FDJ
        run: python3 build_data.py

      - name: Validate against the published archive
        id: validate
        run: python3 validate_release.py

      - name: Publish a complete immutable release
        if: steps.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST_DRAW="$(python3 -c "import json; print(json.load(open('dist/manifest.json'))['lastDraw'])")"
          VERSION="$(python3 -c "import json; print(json.load(open('dist/manifest.json'))['archiveVersion'])")"
          TAG="data-${VERSION#stator49-fdj-}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$TAG" dist/manifest.json dist/loto_draws.json --clobber
          else
            gh release create "$TAG" dist/manifest.json dist/loto_draws.json --draft \
              --title "STATOR49 data — $LAST_DRAW" \
              --notes "Archive publique Loto + Super Loto reconstruite depuis les historiques FDJ."
          fi
          gh release edit "$TAG" --draft=false --latest

      - name: Verify public latest URLs
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path
          base='https://github.com/Fabion80/STATORDATA/releases/latest/download/'
          with urllib.request.urlopen(base+'manifest.json',timeout=30) as r:
              manifest=json.load(r)
          with urllib.request.urlopen(base+'loto_draws.json',timeout=40) as r:
              data=r.read()
          expected=json.loads(Path('dist/manifest.json').read_text())
          assert manifest['schemaVersion']==1
          assert manifest['archiveVersion']==expected['archiveVersion']
          assert manifest['sha256']==hashlib.sha256(data).hexdigest()
          assert len(json.loads(data)['draws'])==manifest['drawCount']
          print('Public latest release OK:',manifest['lastDraw'],manifest['drawCount'])
          PY

